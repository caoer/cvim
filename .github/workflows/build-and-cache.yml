name: "Build and push to niks3 cache"
# Builds cvim's `default` and `server` for every fleet platform and pushes both
# closures to the PUBLIC niks3 cache (cache.0xtau.com — R2 CDN, zero egress)
# under stable pins, so downstream hosts substitute instead of rebuilding. No
# pull token is needed: substituter + public key live in this flake's nixConfig.
# NAR bytes upload direct to R2 via presigned URLs, so the CF-tunnel 100 MB
# request-body limit never applies.
#
# SECURITY INVARIANT — no `pull_request` trigger, anywhere in this file.
# NIKS3_TOKEN is the fleet niks3 API token and niks3 auth is all-or-nothing:
# no per-cache scoping. A token that reaches untrusted code is a signing oracle
# for a cache key every substituting host in the fleet trusts, i.e. signed-
# substitute RCE across the fleet. So secrets are reachable only from
# `push: main` and `workflow_dispatch`, both of which require write access to
# this repo. This is structural, not conditional — there is no `if:` that makes
# a fork PR safe enough to hold this token. If PR validation is ever wanted, it
# goes in a SEPARATE workflow file that references no secret and has no push
# step.
on:
  push:
    branches:
      - "main"
  workflow_dispatch:

concurrency:
  # Serialize per ref, but NEVER kill a run that is already building. This job's
  # whole purpose is a side effect — pins landing in the cache — so an in-flight
  # run is worth finishing even when a newer commit exists. `cancel-in-progress:
  # true` cost run 30253717211 its aarch64-darwin leg: an unrelated merge to main
  # killed it mid-`nix-store --gc`, and a cancelled run reports `cancelled`, not
  # failure. Nobody watching for red sees anything wrong while no pins land, so
  # during a burst of layer merges the fleet would trust a gating job that
  # quietly stopped running.
  #
  # With `false`, GitHub still cancels superseded *pending* runs, which is the
  # behaviour worth having: no started run is ever discarded, and the newest
  # commit always gets one.
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

permissions:
  contents: "read"

jobs:
  # Config lint. Holds no secrets, and gates the build job below via `needs:`, so
  # a violation fails the run in seconds instead of after three full builds.
  lint:
    runs-on: "ubuntu-latest"
    permissions:
      contents: "read"
    steps:
      - uses: "actions/checkout@v6"
        with:
          persist-credentials: false

      - uses: "DeterminateSystems/determinate-nix-action@v3"
        with:
          extra-conf: |
            accept-flake-config = true
            allow-import-from-derivation = false

      - name: "lz.n lint — no destructive `after`, no lazy spec without a provider"
        # Asks the EVALUATED module two questions, rather than pattern-matching the
        # text that produced it:
        #
        #   AFTER  is `after` set beneath any plugin's `lazyLoad.settings`?
        #   INERT  does any plugin intend to be lazy-loaded while lz.n is off?
        #
        # Why not grep: `plugins.x.lazyLoad.settings.after = v` and
        # `plugins.x.lazyLoad = { settings = { after = v; }; }` are the same attrset
        # once merged, so every spelling is caught by construction and no comment or
        # Lua string can trigger it. Why the second question exists at all, and the
        # nixvim source behind both: .github/lint/no-lazyload-after.nix
        #
        # Evaluation only — no derivation is built, so this holds with IFD off.
        #
        # Only stdout is captured. `nix eval` writes warnings to stderr, and folding
        # them into the result makes any warning read as a violation. An eval
        # FAILURE exits 1 and re-runs to show the error: a lint that cannot run must
        # never read as a lint that passed.
        run: |
          set -uo pipefail
          status=0
          for config in default server lab; do
            hits=$(nix eval --raw ".#nixvimConfigurations.x86_64-linux.$config" \
              --apply "$(cat .github/lint/no-lazyload-after.nix)" 2>/dev/null) || {
                echo "::error::lint could not evaluate .#nixvimConfigurations.x86_64-linux.$config"
                nix eval --raw ".#nixvimConfigurations.x86_64-linux.$config" \
                  --apply "$(cat .github/lint/no-lazyload-after.nix)" || true
                exit 1
              }
            if [ -z "$hits" ]; then
              echo "ok: $config — no destructive after, no lazy spec without a provider"
              continue
            fi
            status=1
            printf '%s\n' "$hits" | sed "s|^|  $config: |"
          done
          if [ "$status" -ne 0 ]; then
            echo '::error::AFTER lines: replace lazyLoad.settings.after with luaConfig.post — `after` REPLACES the plugin config instead of appending, silently dropping it.'
            echo '::error::INERT lines: enable plugins.lz-n, or drop the lazyLoad spec — with no provider nothing consumes the spec, so the plugin NEVER LOADS and its setup() never runs. Verified at nixvim lib/plugins/mk-neovim-plugin.nix: setup reaches init.lua only under `mkIf (!cfg.lazyLoad.enable)`.'
            exit 1
          fi

      # Formatting drift, reported and never blocking. Deliberately the ONLY
      # continue-on-error step in this job.
      #
      # WHY NOT BLOCKING: `build` needs: `lint`, so a red here would stop six
      # pins landing (default+server × 3 platforms) and force the fleet to
      # rebuild — over whitespace whose derivation output is provably
      # byte-identical. The red-means-pins-stop rule is justified by a config
      # that will not START; formatting does not reach that bar.
      #
      # WHY NOT A PR GATE: there are none. Integration here is local `git merge`
      # plus push — measured at zero PR merges across the last 40 commits on
      # main — so a `pull_request`-triggered check would never fire. A gate
      # hanging on a trigger the commit graph never produces is enforcement in
      # name only.
      #
      # WHY NOT A FLAKE CHECK: this workflow deliberately avoids
      # `nix flake check` because it cannot exempt `lab`, and nothing else
      # invokes it — a `checks.<sys>.formatting` would never execute.
      #
      # KNOWN COST: non-blocking red decays into ignored red. The mitigation is
      # that this stays the only continue-on-error step here, and the drift is
      # printed as a FILE LIST rather than a bare failure, because a specific
      # line decays slower than a generic one. Ignored twice is evidence to
      # revisit this, not an argument to have again.
      # `--ci` is treefmt's own CI mode (--no-cache --fail-on-change). NOT
      # `--check`, which this formatter does not accept — it prints help and
      # exits 1 on a CLEAN tree, so the step would be permanently red on day
      # one, which is exactly the ignored-red failure this comment claims to
      # mitigate. Verified on both arms before landing: clean tree exit 0,
      # injected drift exit 1 naming the file.
      - name: "nixfmt drift — reported, never blocking"
        continue-on-error: true
        run: |
          if nix fmt -- --ci . >/tmp/fmt.out 2>&1; then
            echo "nixfmt: clean"
            exit 0
          fi
          echo '::warning::nixfmt would reformat these files — run `nix fmt`:'
          grep -oE 'path=[^ ]+\.nix' /tmp/fmt.out | sed 's/^path=//' | sort -u |
            while read -r f; do
              echo "::warning file=$f::$f is not nixfmt-clean"
            done
          cat /tmp/fmt.out
          exit 1

  # The gating job. Its success is what the fleet trusts: both pins point at a
  # closure that is fully present in the cache.
  build:
    needs: "lint"
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: "x86_64-linux"
            runner: "ubuntu-latest"
          - system: "aarch64-linux"
            runner: "ubuntu-24.04-arm"
          - system: "aarch64-darwin"
            runner: "macos-latest"
    runs-on: "${{ matrix.runner }}"
    steps:
      - uses: "actions/checkout@v6"
        with:
          persist-credentials: false

      - uses: "DeterminateSystems/determinate-nix-action@v3"
        with:
          # IFD stays off in the runner's own nix.conf, not only in the flake's
          # nixConfig: a build that starts needing import-from-derivation must
          # fail here rather than quietly evaluate under a permissive default.
          # `accept-flake-config` is what lets the flake's substituter list
          # (cache.0xtau.com) apply.
          extra-conf: |
            accept-flake-config = true
            allow-import-from-derivation = false

      - name: "Install niks3 client (pinned to the rev osfiles locks)"
        # Same rev as the `niks3` node in /Users/Shared/projects/caoer/osfiles
        # flake.lock. nixpkgs' niks3 lags and lacks `--pin`. Bump this together
        # with the osfiles niks3 input, never independently.
        # Installed BEFORE the first build so the profile GC root keeps the
        # client alive across the `nix-store --gc` steps below.
        run: nix profile install github:Mic92/niks3/abbc291d372d2d821327516b5f5224de03113204#niks3

      - name: "Configure niks3 auth"
        # The only step in this workflow that touches the secret. The token
        # lands in a 0600 file under RUNNER_TEMP; every push step reads it via
        # NIKS3_AUTH_TOKEN_FILE, so no push step carries the value in its env.
        env:
          NIKS3_TOKEN: "${{ secrets.NIKS3_TOKEN }}"
        run: |
          umask 077
          printf '%s' "$NIKS3_TOKEN" > "$RUNNER_TEMP/niks3-token"
          echo "NIKS3_AUTH_TOKEN_FILE=$RUNNER_TEMP/niks3-token" >> "$GITHUB_ENV"
          echo "NIKS3_SERVER_URL=https://niks3.0xtau.com" >> "$GITHUB_ENV"

      - name: "Disk before build"
        run: df -h / /nix

      - name: "default — build, start the editor, push under its pin, reclaim the disk"
        # THE SMOKE TEST, AND WHY IT SITS BEFORE THE PUSH. `nix build .#packages`
        # proves the config evaluates and the closure builds. It does NOT prove
        # neovim starts: `extraConfigLua` bodies, `require` paths and plugin
        # `setup()` arguments are strings until neovim reads them, so no module
        # assertion can see a fault inside one. `.#checks.<sys>.<out>` is nixvim's
        # `build.test`, the only derivation here that actually starts the editor
        # (`nvim -mn --headless +q`, failing on any stderr). Running it between the
        # build and the push is what keeps a closure whose init.lua errors at
        # startup from landing under a pin the fleet substitutes.
        #
        # It is nearly free, and that is measured, not assumed. The check's build
        # closure is a strict SUBSET of the package's plus exactly one derivation
        # — itself — on every output and system (verified with `nix-store -qR` over
        # both drvPaths). So after the package build above, this line realises one
        # trivial `runCommandLocal` whose inputs are all already in the store.
        #
        # Order matters twice: after the package build, because that is what makes
        # it incremental; and before `nix-store --gc` below, because after
        # collection the closure is gone and the same line becomes a full rebuild.
        #
        # WHAT THIS GATE CANNOT SEE — read before writing "CI will catch it".
        # Its reach is bounded by WHICH CONFIGURATIONS GET BUILT, not by how
        # thoroughly each one is checked. The option surface offers values the
        # three shipped outputs never instantiate, and everything reachable only
        # through that remainder is invisible to every gate here — lint,
        # assertions, the package build, and this check — because none of them
        # ever constructs it. Demonstrated: a real defect fixed on 2026-07-27
        # manifested only at `cvim.lang.*.toolchain = "devshell"`, a value
        # `modules/options/lang.nix` documents as supported and no output uses.
        # The package drvPaths were BYTE-IDENTICAL before and after that fix, so
        # these checks were green either way and could not have varied with it.
        # Building the cross-product of every option value is absurd and is not
        # the answer; knowing the boundary is. Corollary worth acting on: an
        # assertion rides every package build, including a host's own
        # `extendModules` build, so a requirement expressed as an assertion
        # reaches configurations these checks never will.
        #
        # `nix-store --gc` between the two outputs, and `default` first so the
        # larger closure meets the emptiest store. The out-link must be removed
        # before collecting — it is an indirect GC root, and leaving it makes the
        # collection a no-op. `server`'s shared paths then re-substitute from the
        # closure this step just pushed.
        #
        # WHAT THIS IS AND IS NOT INSURANCE AGAINST. The plan sized this against
        # ~14 GB decimal of runner free space, which would leave ~0.22 GB of
        # headroom for the measured 13.78 GB x86_64-linux `default`
        # (docs/baseline-closures.md) and make collection the only reason the job
        # survives. That is not what the runners actually give us. Measured by the
        # "Disk before build" step above, before any build:
        #
        #     x86_64-linux    /dev/root  145G  58G   87G  40% /
        #     aarch64-linux   /dev/root  145G  37G  108G  26% /
        #     aarch64-darwin  /dev/disk3s1s1  320Gi  12Gi  94Gi  12% /
        #
        # 87–108 GB, so the two outputs fit together with room to spare and this
        # step is cheap insurance rather than the thing keeping the job alive.
        # Keep it: it costs seconds, and it is what absorbs both an image that
        # shrinks and the closure growth still ahead of us as the layers land.
        # Do not budget closure size against a 14 GB CI ceiling — there isn't one.
        run: |
          nix build .#packages.${{ matrix.system }}.default -L --out-link result-default
          t0=$(date +%s)
          nix build .#checks.${{ matrix.system }}.default -L --no-link
          echo "smoke(default) wall-clock: $(( $(date +%s) - t0 ))s"
          niks3 push --pin "cvim-default-${{ matrix.system }}" ./result-default
          rm -f result-default
          nix-store --gc
          df -h / /nix

      - name: "server — build, start the editor, push under its pin, reclaim the disk"
        run: |
          nix build .#packages.${{ matrix.system }}.server -L --out-link result-server
          t0=$(date +%s)
          nix build .#checks.${{ matrix.system }}.server -L --no-link
          echo "smoke(server) wall-clock: $(( $(date +%s) - t0 ))s"
          niks3 push --pin "cvim-server-${{ matrix.system }}" ./result-server
          rm -f result-server
          nix-store --gc
          df -h / /nix

      - name: "lab — experimental layer, never blocks the gate"
        # `lab` is the scratch layer for plugin trials, so it breaks by design.
        # Two things keep it off the fleet's gate: it is the LAST step, after
        # both pins have landed, and it is continue-on-error, so a red lab still
        # leaves this job green.
        #
        # It pushes WITHOUT `--pin` deliberately. An unpinned closure ages out of
        # the niks3 server's 30-day GC on its own, so daily lab churn does not
        # accumulate pinned garbage that nothing ever reclaims.
        #
        # lab gets the same smoke test, and `continue-on-error` is what keeps D12
        # intact: a lab whose editor will not start turns this step red and the
        # job stays green, because both pins have already landed above. This is
        # also why the fix is three explicit `nix build .#checks.<out>` lines and
        # not `nix flake check` — flake check has no way to exempt lab, so it
        # would let the scratch layer block the fleet's pins.
        continue-on-error: true
        run: |
          nix build .#packages.${{ matrix.system }}.lab -L --out-link result-lab
          t0=$(date +%s)
          nix build .#checks.${{ matrix.system }}.lab -L --no-link
          echo "smoke(lab) wall-clock: $(( $(date +%s) - t0 ))s"
          niks3 push ./result-lab
